<!DOCTYPE html>
<html>
<head>


<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>
@keyframes ehBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes ehListen{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes ehPulse{0%,100%{transform:scale(.97);filter:brightness(1)}50%{transform:scale(1.03);filter:brightness(1.15)}}
@keyframes ehSpeak{0%,100%{transform:scale(1,1)}30%{transform:scale(1.06,1.03)}60%{transform:scale(1.02,1.06)}}
@keyframes ehShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes ehSpin{to{transform:rotate(360deg)}}
@keyframes ehRipple{from{transform:scale(1);opacity:.45}to{transform:scale(1.7);opacity:0}}
@keyframes ehHalo{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
@keyframes ehBar{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes ehDrift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8%,-6%) scale(1.12)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}}
</style></helmet>
<div style="display:grid;place-items:center">{{ el }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:320},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;vidro&quot;,&quot;anel&quot;,&quot;aurora&quot;],&quot;default&quot;:&quot;vidro&quot;,&quot;tsType&quot;:&quot;'vidro'|'anel'|'aurora'&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;listening&quot;,&quot;processing&quot;,&quot;speaking&quot;,&quot;error&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:196,&quot;min&quot;:60,&quot;max&quot;:400,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  glow(err){ return err ? 'rgba(224,80,75,.35)' : 'rgba(43,92,245,.45)'; }
  halo(s, err){
    return React.createElement('div',{key:'halo',style:{position:'absolute',inset:'-26%',borderRadius:'50%',background:`radial-gradient(circle,${this.glow(err)} 0%,transparent 62%)`,opacity:s==='idle'?.55:1,transition:'opacity .6s',animation:s==='speaking'?'ehHalo 1.2s ease-in-out infinite':'none',pointerEvents:'none'}});
  }
  ripples(s, color){
    if (s !== 'listening') return [];
    return [0,.75].map((d,i)=>React.createElement('div',{key:'r'+i,style:{position:'absolute',inset:0,borderRadius:'50%',border:`1.5px solid ${color}`,animation:`ehRipple 1.5s ease-out ${d}s infinite`}}));
  }
  anim(s){ return {idle:'ehBreath 5s ease-in-out infinite',listening:'ehListen 1.5s ease-in-out infinite',processing:'ehPulse .9s ease-in-out infinite',speaking:'ehSpeak .8s ease-in-out infinite',error:'ehShake .5s ease-in-out 1'}[s]; }
  vidro(s, size){
    const e = React.createElement, err = s==='error';
    const body = err
      ? 'radial-gradient(circle at 34% 28%,rgba(255,255,255,.9) 0%,rgba(255,255,255,0) 24%),radial-gradient(circle at 55% 65%,#E88A7E 0%,#B8433C 58%,#5A1B1A 100%)'
      : 'radial-gradient(circle at 34% 28%,rgba(255,255,255,.95) 0%,rgba(255,255,255,0) 24%),radial-gradient(circle at 76% 82%,rgba(34,196,245,.75),transparent 46%),radial-gradient(circle at 55% 62%,#7FA2FF 0%,#2B5CF5 55%,#10267A 100%)';
    const kids = [this.halo(s,err), ...this.ripples(s,'#2B5CF5')];
    if (s==='processing') kids.push(e('div',{key:'spin',style:{position:'absolute',inset:-12,borderRadius:'50%',background:'conic-gradient(from 0deg,transparent 0 55%,#2B5CF5 78%,#22C4F5 92%,transparent)',WebkitMask:'radial-gradient(circle,transparent 66%,#000 67%)',mask:'radial-gradient(circle,transparent 66%,#000 67%)',animation:'ehSpin 1.1s linear infinite'}}));
    kids.push(e('div',{key:'core',style:{position:'absolute',inset:0,borderRadius:'50%',background:body,boxShadow:`inset 0 -10px 30px rgba(0,0,0,.25),inset 0 2px 1px rgba(255,255,255,.35),0 20px 50px -18px ${this.glow(err)}`,animation:this.anim(s)}},
      e('div',{style:{position:'absolute',inset:'8% 14% 50% 14%',borderRadius:'50%',background:'linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0))'}})));
    return e('div',{style:{position:'relative',width:size,height:size}}, ...kids);
  }
  anel(s, size){
    const e = React.createElement, err = s==='error';
    const c1 = err?'#D8453F':'#2B5CF5', c2 = err?'#F29A8F':'#22C4F5';
    const w = Math.round(size*({idle:.018,listening:.04,processing:.028,speaking:.034,error:.028}[s]));
    const ringAnim = {idle:'ehSpin 14s linear infinite',listening:'ehSpin 5s linear infinite',processing:'ehSpin .9s linear infinite',speaking:'ehSpin 3s linear infinite',error:'none'}[s];
    const showBars = s==='listening' || s==='speaking';
    const bars = [0,1,2,3,4].map(i=>e('span',{key:i,style:{width:Math.max(3,size*.022),height:size*.2,borderRadius:3,background:`linear-gradient(180deg,${c2},${c1})`,animation:showBars?`ehBar ${s==='speaking'?.55+i*.07:.9+i*.1}s ease-in-out ${i*.08}s infinite`:'none',transform:showBars?undefined:'scaleY(.18)',transition:'transform .3s'}}));
    return e('div',{style:{position:'relative',width:size,height:size,animation:this.anim(s)}},
      this.halo(s,err), ...this.ripples(s,c1),
      e('div',{key:'ring',style:{position:'absolute',inset:0,borderRadius:'50%',background:`conic-gradient(from 0deg,${c1},${c2},${c1} 60%,${c2},${c1})`,WebkitMask:`radial-gradient(closest-side,transparent calc(100% - ${w}px),#000 calc(100% - ${w-1}px))`,mask:`radial-gradient(closest-side,transparent calc(100% - ${w}px),#000 calc(100% - ${w-1}px))`,animation:ringAnim,filter:`drop-shadow(0 0 ${Math.round(size*.04)}px ${c2}66)`}}),
      e('div',{key:'disc',style:{position:'absolute',inset:'13%',borderRadius:'50%',background:'radial-gradient(circle at 35% 28%,rgba(255,255,255,.55),rgba(255,255,255,.10) 60%,rgba(255,255,255,.04))',border:'1px solid rgba(255,255,255,.35)',boxShadow:`inset 0 0 ${size*.12}px ${c1}33,0 10px 30px -14px ${c1}88`,backdropFilter:'blur(10px)',WebkitBackdropFilter:'blur(10px)',display:'flex',alignItems:'center',justifyContent:'center',gap:Math.max(3,size*.02)}}, ...bars)
    );
  }
  aurora(s, size){
    const e = React.createElement, err = s==='error';
    const cols = err ? ['#F29A8F','#D8453F','#8E2A26'] : ['#22C4F5','#2B5CF5','#8FB0FF'];
    const spin = {idle:'16s',listening:'6s',processing:'1.8s',speaking:'3.5s',error:'16s'}[s];
    const blob = (i,top,left,sc)=>e('div',{key:'b'+i,style:{position:'absolute',top,left,width:'68%',height:'68%',borderRadius:'50%',background:cols[i],filter:`blur(${Math.round(size*.1)}px)`,opacity:.95,animation:`ehDrift ${s==='processing'?1.2+i*.3:4+i*1.3}s ease-in-out infinite`}});
    return e('div',{style:{position:'relative',width:size,height:size,animation:this.anim(s)}},
      this.halo(s,err), ...this.ripples(s,cols[1]),
      e('div',{key:'clip',style:{position:'absolute',inset:0,borderRadius:'50%',overflow:'hidden',background:err?'#3A1413':'#0C1E66',boxShadow:`0 20px 50px -18px ${this.glow(err)}`}},
        e('div',{style:{position:'absolute',inset:0,animation:`ehSpin ${spin} linear infinite`}}, blob(0,'-6%','-4%'), blob(1,'36%','30%'), blob(2,'4%','44%')),
        e('div',{style:{position:'absolute',inset:0,borderRadius:'50%',background:'radial-gradient(circle at 34% 26%,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 22%)',boxShadow:'inset 0 0 0 1px rgba(255,255,255,.25),inset 0 -12px 30px rgba(0,0,0,.25)'}}))
    );
  }
  renderVals(){
    const v = this.props.variant ?? 'vidro', s = this.props.state ?? 'idle', size = Number(this.props.size ?? 196);
    return { el: (this[v] ? this[v](s,size) : this.vidro(s,size)) };
  }
}
</script>
</body>
</html>
